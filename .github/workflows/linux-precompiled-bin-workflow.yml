name: Build Linux Precompiled Binaries

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      isNightly:
        type: boolean
        required: true
        default: false
      x86_64Only:
        type: boolean
        required: false
        default: false

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1

jobs:
  build-precompiled-bin-x86_64:
    runs-on: rag3db-self-hosted-linux-building-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Update nightly version
        if: ${{ inputs.isNightly == true }}
        run: |
          /opt/python/cp310-cp310/bin/python -m pip install packaging
          /opt/python/cp310-cp310/bin/python update-nightly-build-version.py
        working-directory: scripts

      - name: Build precompiled binaries
        run: |
          make NUM_THREADS=$(nproc)
          make install

      - name: Collect artifacts
        run: |
          mv install/include/rag3db.h .
          mv install/include/rag3db.hpp .
          mv install/lib64/librag3db.so .
          mv install/bin/rag3db .

      - name: Create tarball
        run: |
          tar -czvf librag3db-linux-x86_64.tar.gz rag3db.h rag3db.hpp librag3db.so
          tar -czvf rag3db_cli-linux-x86_64.tar.gz rag3db

      - uses: actions/upload-artifact@v4
        with:
          name: librag3db-linux-x86_64
          path: librag3db-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: rag3db_cli-linux-x86_64
          path: rag3db_cli-linux-x86_64.tar.gz

  build-precompiled-bin-aarch64:
    if: ${{ inputs.x86_64Only != true }}
    runs-on: rag3db-self-hosted-linux-building-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Update nightly version
        if: ${{ inputs.isNightly == true }}
        run: |
          /opt/python/cp310-cp310/bin/python -m pip install packaging
          /opt/python/cp310-cp310/bin/python update-nightly-build-version.py
        working-directory: scripts

      - name: Build precompiled binaries
        run: |
          make NUM_THREADS=$(nproc)
          make install

      - name: Collect artifacts
        run: |
          mv install/include/rag3db.h .
          mv install/include/rag3db.hpp .
          mv install/lib64/librag3db.so .
          mv install/bin/rag3db .

      - name: Create tarball
        run: |
          tar -czvf librag3db-linux-aarch64.tar.gz rag3db.h rag3db.hpp librag3db.so
          tar -czvf rag3db_cli-linux-aarch64.tar.gz rag3db

      - uses: actions/upload-artifact@v4
        with:
          name: librag3db-linux-aarch64
          path: librag3db-linux-aarch64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: rag3db_cli-linux-aarch64
          path: rag3db_cli-linux-aarch64.tar.gz

  build-precompiled-bin-android-armv8a:
    if: ${{ inputs.x86_64Only != true }}
    runs-on: rag3db-self-hosted-testing
    steps:
      - uses: actions/checkout@v4

      - name: Update nightly version
        if: ${{ inputs.isNightly == true }}
        run: |
          python3 -m pip install packaging
          python3 update-nightly-build-version.py
        working-directory: scripts

      - name: Build precompiled binaries
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a  ..
          make -j$(nproc)
          cd ..
          cmake --install build --prefix install
    
      - name: Collect artifacts
        run: |
          mv install/include/rag3db.h .
          mv install/include/rag3db.hpp .
          mv install/lib/librag3db.so .
          mv install/bin/rag3db .
        
      - name: Create tarball
        run: |
          tar -czvf librag3db-android-armv8a.tar.gz rag3db.h rag3db.hpp librag3db.so
          tar -czvf rag3db_cli-android-armv8a.tar.gz rag3db
        
      - uses: actions/upload-artifact@v4
        with:
          name: librag3db-android-armv8a
          path: librag3db-android-armv8a.tar.gz
        
      - uses: actions/upload-artifact@v4
        with:
          name: rag3db_cli-android-armv8a
          path: rag3db_cli-android-armv8a.tar.gz
