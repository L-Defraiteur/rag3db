name: rag3weaver

# Garde-fou contre la dette invisible.
#
# La migration async→sync du 17 mai 2026 a cassé les features `postgres`,
# `wasm-emscripten` et les exemples. Personne ne l'a vu pendant trois mois parce
# qu'aucun job de CI ne couvrait ce crate : les 29 autres workflows sont hérités
# de kuzu et ne touchent pas extension/rag3weaver.
#
# Rouge du 3 septembre au 18 octobre 2026 sans que personne le voie (991 runs, ticket
# docs/tickets/2026-10-18-la-ci-de-rag3weaver-etait-rouge-sans-que-personne-le-voie.md) :
# remise en état le 18 octobre. Le contrôle est celui des postes, scripts/check_features.sh
# (ses jeux font foi), le moteur bâti en statique par la crate rag3db. Les tests E2E
# (`#[ignore]`) restent manuels via run_e2e.sh.

on:
  push:
    branches: [master, main]
    paths:
      - 'extension/rag3weaver/**'
      - '.github/workflows/rag3weaver-workflow.yml'
  pull_request:
    paths:
      - 'extension/rag3weaver/**'
      - '.github/workflows/rag3weaver-workflow.yml'
  workflow_dispatch:

concurrency:
  group: rag3weaver-${{ github.ref }}
  # Sur master, chaque run va au bout : un run dure plus d'une heure (le moteur se bâtit) et master
  # reçoit des pushes plus souvent ; annulés, ses runs ne rendaient jamais de verdict (18 octobre 2026).
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  # Pas de -D warnings global : la crate rag3db (chemin) en a 28 qui ne sont pas du
  # ressort de ce crate, et check_features ne les refuse pas non plus sur les postes.

defaults:
  run:
    working-directory: extension/rag3weaver

jobs:
  # **Les jeux de check_features.sh**, tels que les postes les jouent avant tout hash :
  # chacun séparément (l'unification des features de cargo masquerait un `dep:`
  # manquant). L'ancienne matrice (candle, wasm) nommait des features retirées.
  check:
    name: check_features (cinq jeux) et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      # codeparsers est une dépendance par chemin : cargo l'exige même sans la feature code.
      - name: Sous-module codeparsers (par https, sans clé)
        working-directory: .
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 extension/rag3weaver/codeparsers

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extension/rag3weaver
          key: check-features

      - name: check_features.sh
        env:
          RAG3DB_LIB: statique
          # Sans couleur : la sortie des jeux rouges se lit par `^error` (18 octobre 2026).
          CARGO_TERM_COLOR: never
          CHECK_FEATURES_LOGS: ${{ runner.temp }}/check-features
          CHECK_FEATURES_TIMEOUT: '5400'
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: bash scripts/check_features.sh

      # Les tests unitaires, sous le jeu du paquet, sur le moteur bâti par cargo. Sans feature,
      # cinq tests qui supposent `code` rougissent : ils ne sont pas gardés par cfg (voir le
      # ticket) ; on les joue comme les postes, avec leurs features.
      - name: Bâti des tests unitaires
        run: cargo test --lib --features rag3db-native,code,daemon,openai-llm --no-run

      # L'extension vector, que les backends chargent : bâtie sur le bâti cmake du moteur que
      # cargo vient de faire (comme le paquet), elle se pose dans extension/vector/build/,
      # où le backend la cherche.
      - name: L'extension vector, du même bâti
        working-directory: .
        run: |
          bdir=$(ls -td extension/rag3weaver/target/debug/build/rag3db-*/out/build | head -1)
          cmake -S . -B "$bdir" -DBUILD_EXTENSIONS=vector -DBUILD_SHELL=OFF -DBUILD_SINGLE_FILE_HEADER=OFF -DAUTO_UPDATE_GRAMMAR=OFF > "${{ runner.temp }}/cmake-vector.log" 2>&1 || { tail -30 "${{ runner.temp }}/cmake-vector.log"; exit 1; }
          cmake --build "$bdir" --target rag3db_vector_extension -j 4 >> "${{ runner.temp }}/cmake-vector.log" 2>&1 || { tail -30 "${{ runner.temp }}/cmake-vector.log"; exit 1; }
          ls -la extension/vector/build/libvector.rag3db_extension

      # Deux tests exigent un moteur lié en partagé (la lib lue dans /proc/self/maps) : en
      # statique, ils ne peuvent pas passer ici ; ils se jouent sur les postes.
      - name: cargo test --lib (rag3db-native,code,daemon,openai-llm)
        run: >-
          cargo test --lib --features rag3db-native,code,daemon,openai-llm --
          --skip the_extension_next_to_the_loaded_lib_is_loaded_without_any_variable
          --skip the_test_helper_loads_the_extension_of_the_loaded_lib_not_of_the_tree

      - name: La sortie des jeux rouges
        if: failure()
        working-directory: .
        run: |
          for f in "${{ runner.temp }}"/check-features/*.log; do
            grep -q -E "^error" "$f" || continue
            echo "=== $(basename "$f")"; grep -E -A6 "^error" "$f" | head -60
          done

  # Le job « tests unitaires » sans feature est fondu dans `check` (18 octobre 2026).

  # fmt + clippy est retiré (18 octobre 2026) : il passait pour vert par
  # `continue-on-error`, alors que fmt et clippy rougissaient sur le passif. Il revient
  # quand le crate est formaté et que clippy est propre, sans `continue-on-error`.
