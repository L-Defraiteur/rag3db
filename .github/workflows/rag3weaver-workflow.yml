name: rag3weaver

# Garde-fou contre la dette invisible.
#
# La migration async→sync du 17 mai 2026 a cassé les features `postgres`,
# `wasm-emscripten` et les exemples. Personne ne l'a vu pendant trois mois parce
# qu'aucun job de CI ne couvrait ce crate : les 29 autres workflows sont hérités
# de kuzu et ne touchent pas extension/rag3weaver.
#
# Ce job ne compile QUE du Rust. Il ne construit pas librag3db.so — ce serait long
# et ça masquerait les régressions Rust derrière des soucis de toolchain C++. Les
# tests E2E (152, tous `#[ignore]`) restent manuels via run_e2e.sh.

on:
  push:
    branches: [master, main]
    paths:
      - 'extension/rag3weaver/**'
      - '.github/workflows/rag3weaver-workflow.yml'
  pull_request:
    paths:
      - 'extension/rag3weaver/**'
      - '.github/workflows/rag3weaver-workflow.yml'
  workflow_dispatch:

concurrency:
  group: rag3weaver-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: extension/rag3weaver

jobs:
  # Chaque combinaison de features doit compiler séparément. L'unification des
  # features de cargo fait qu'un `--all-features` vert ne prouve RIEN sur les
  # combinaisons individuelles : une dépendance activée par une autre feature
  # peut masquer un `dep:` manquant.
  check:
    name: check ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `default` est vide depuis le 24 août 2026 (aucun embedder) ; candle
          # n'est donc plus couvert implicitement et a sa propre entrée.
          - label: default
            flags: ''
          - label: candle-embedder
            flags: '--features candle-embedder'
          - label: bge-m3
            flags: '--features bge-m3'
          - label: candle-wasm
            flags: '--no-default-features --features candle-wasm'
          - label: burn-embedder
            flags: '--no-default-features --features burn-embedder'
          - label: postgres
            flags: '--features postgres'
          - label: wasm-emscripten
            flags: '--features wasm-emscripten'
    steps:
      # Pas de submodules (third_party/fuzzy-fst n'est pas accessible publiquement).
      # Les deps `path` hors dépôt (lucivy-core, luciole, sparse-vector, lucistore)
      # viennent d'un clone de lucivy à la révision épinglée par le submodule
      # extension/lucivy/ld-lucivy — lue avec `git ls-tree`, sans l'initialiser.
      - uses: actions/checkout@v4
      - name: lucivy à la révision du submodule (path deps de rag3weaver)
        run: |
          sha=$(git ls-tree HEAD extension/lucivy/ld-lucivy | awk '{print $3}')
          git clone --quiet https://github.com/L-Defraiteur/lucivy.git ../lucivy
          git -C ../lucivy checkout --quiet "$sha"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extension/rag3weaver
          key: ${{ matrix.label }}

      - name: cargo check --lib
        run: cargo check --lib ${{ matrix.flags }}

      - name: cargo check --examples
        run: cargo check --examples ${{ matrix.flags }}

  test:
    name: tests unitaires
    runs-on: ubuntu-latest
    steps:
      # Pas de submodules (third_party/fuzzy-fst n'est pas accessible publiquement).
      # Les deps `path` hors dépôt (lucivy-core, luciole, sparse-vector, lucistore)
      # viennent d'un clone de lucivy à la révision épinglée par le submodule
      # extension/lucivy/ld-lucivy — lue avec `git ls-tree`, sans l'initialiser.
      - uses: actions/checkout@v4
      - name: lucivy à la révision du submodule (path deps de rag3weaver)
        run: |
          sha=$(git ls-tree HEAD extension/lucivy/ld-lucivy | awk '{print $3}')
          git clone --quiet https://github.com/L-Defraiteur/lucivy.git ../lucivy
          git -C ../lucivy checkout --quiet "$sha"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extension/rag3weaver

      # Les 152 tests E2E sont `#[ignore]` + cfg(rag3db-native) : ils exigent
      # librag3db.so et ne tournent pas ici.
      - name: cargo test --lib
        run: cargo test --lib

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      # Pas de submodules (third_party/fuzzy-fst n'est pas accessible publiquement).
      # Les deps `path` hors dépôt (lucivy-core, luciole, sparse-vector, lucistore)
      # viennent d'un clone de lucivy à la révision épinglée par le submodule
      # extension/lucivy/ld-lucivy — lue avec `git ls-tree`, sans l'initialiser.
      - uses: actions/checkout@v4
      - name: lucivy à la révision du submodule (path deps de rag3weaver)
        run: |
          sha=$(git ls-tree HEAD extension/lucivy/ld-lucivy | awk '{print $3}')
          git clone --quiet https://github.com/L-Defraiteur/lucivy.git ../lucivy
          git -C ../lucivy checkout --quiet "$sha"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extension/rag3weaver

      - name: cargo fmt --check
        run: cargo fmt --check
        continue-on-error: true # informatif tant que le code n'est pas formaté

      # Le code de generated/ est produit par burn-onnx : on ne le lint pas.
      - name: cargo clippy
        run: cargo clippy --lib --all-targets
        continue-on-error: true # informatif tant que le passif n'est pas résorbé
