[package]
name = "sparse-vector"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Sparse vector inverted index with WAND pruning, inspired by Qdrant (Apache 2.0)"

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1"
cxx = "1.0"
ordered-float = "4"
parking_lot = "0.12"
memmap2 = "0.9"
lucivy-core = { path = "../../lucivy/ld-lucivy/lucivy_core" }

[build-dependencies]
cxx-build = "1.0"

[profile.release]
opt-level = "z"
lto = "thin"
