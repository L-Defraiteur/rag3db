# The teammate's « Previous step » block as a WebAssembly node (the trial of 21 November 2026). Built by
# scripts/build_wasm_nodes.sh into tests/fixtures/wasm_nodes/previous_step.wasm. A crate of its own, outside the
# rag3weaver build: its own workspace, its own target.
[package]
name = "previous_step_wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

[workspace]
