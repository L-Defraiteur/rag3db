<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier</title>
<style>
  :root { --fond: #f7f6f2; --encre: #1f1f1f; --doux: #6b6b6b; --trait: #d9d6cc; --accent: #b8860b; --refus: #a33; --ok: #2f6f3e; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #1b1b1a; --encre: #ecebe6; --doux: #a3a29b; --trait: #3a3935; --accent: #e0b44c; --refus: #e07a7a; --ok: #7cc28a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--fond); color: var(--encre); height: 100vh; display: grid; grid-template-columns: minmax(300px, 34%) 1fr; }
  header { grid-column: 1 / -1; padding: 8px 14px; border-bottom: 1px solid var(--trait); display: flex; gap: 12px; align-items: baseline; }
  header h1 { font-size: 16px; margin: 0; }
  header .etat { color: var(--doux); font-size: 13px; }
  body { grid-template-rows: auto 1fr; }
  #chat { border-right: 1px solid var(--trait); display: flex; flex-direction: column; min-height: 0; }
  #fil { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; }
  .moi { background: var(--trait); align-self: flex-end; max-width: 85%; }
  .agent { border: 1px solid var(--trait); }
  .outil { color: var(--doux); font-size: 13px; }
  .eteint { color: var(--refus); }
  form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--trait); }
  textarea { flex: 1; resize: none; height: 64px; font: inherit; padding: 6px; background: transparent; color: inherit; border: 1px solid var(--trait); border-radius: 6px; }
  button, select { font: inherit; color: inherit; background: transparent; border: 1px solid var(--trait); border-radius: 6px; padding: 4px 10px; }
  #droite { display: grid; grid-template-rows: 1fr auto auto; min-height: 0; }
  #page { display: flex; flex-direction: column; min-height: 0; }
  #page .barre { display: flex; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--trait); align-items: center; }
  iframe { flex: 1; width: 100%; border: 0; background: white; }
  #graphe { border-top: 1px solid var(--trait); padding: 8px 10px; max-height: 32vh; overflow: auto; }
  #journal { border-top: 1px solid var(--trait); padding: 6px 10px; max-height: 20vh; overflow: auto; font-size: 13px; }
  #journal div { padding: 2px 0; }
  .declared, .reloaded { color: var(--ok); }
  .refused { color: var(--refus); white-space: pre-wrap; }
  .vu { outline: 2px solid var(--accent); }
</style>
</head>
<body>
<header><h1 id="nom">Atelier</h1><span class="etat" id="etat"></span></header>
<section id="chat">
  <div id="fil"></div>
  <form id="envoi">
    <textarea id="message" placeholder="Dites ce qu'il faut changer…"></textarea>
    <button>Envoyer</button>
  </form>
</section>
<section id="droite">
  <div id="page">
    <div class="barre"><label>Page <select id="routes"></select></label><button id="recharger" type="button">↻</button></div>
    <iframe id="cadre" title="La page produite"></iframe>
  </div>
  <div id="graphe"><pre class="mermaid" id="dessin"></pre></div>
  <div id="journal"></div>
</section>
<script type="module" src="/_atelier/page.js"></script>
</body>
</html>
