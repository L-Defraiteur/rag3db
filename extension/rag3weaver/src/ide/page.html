<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDE rag3weaver</title>
<!-- Une icône vide : sans elle, le navigateur demande /favicon.ico, hors de la porte de l'IDE (403 à la console, vu par le témoin navigateur). -->
<link rel="icon" href="data:,">
<style>
  :root {
    --fond: #fbfaf7; --surface: #ffffff; --texte: #1d1c1a; --doux: #6b6862; --trait: #e3e0d9;
    --accent: #2f5d8a; --accent-doux: #e6eef6; --marque: #fff3c4; --alerte: #9a3b1f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #17181a; --surface: #1e1f22; --texte: #e8e6e1; --doux: #9a978f; --trait: #2c2d30;
      --accent: #8fb6de; --accent-doux: #22303d; --marque: #3d3620; --alerte: #e3967a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 15px/1.5 system-ui, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { position: sticky; top: 0; z-index: 2; background: var(--fond); border-bottom: 1px solid var(--trait);
    padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header .marque-ide { font-weight: 650; }
  #fil { color: var(--doux); font-size: 14px; overflow-wrap: anywhere; }
  #fil a { color: var(--doux); }
  header form { margin-left: auto; display: flex; gap: 6px; }
  header input { font: inherit; padding: 4px 8px; border: 1px solid var(--trait); border-radius: 6px;
    background: var(--surface); color: var(--texte); width: min(320px, 60vw); }
  #lien { font-size: 12px; color: var(--doux); }
  main { padding: 16px; max-width: 1400px; }
  h1 { font-size: 18px; margin: 0 0 12px; overflow-wrap: anywhere; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); margin: 20px 0 8px; }
  .note { color: var(--doux); font-size: 13px; }
  .alerte { color: var(--alerte); }
  /* Le chat de l'atelier (page 11) : le fil, une bulle par tour, ses outils. */
  .chat { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; max-width: 880px; }
  .chat .tour { border: 1px solid var(--trait); border-radius: 8px; padding: 8px 12px; background: var(--surface); }
  .chat .tour.user { background: var(--accent-doux); align-self: flex-end; max-width: 85%; }
  .chat .tour.en-cours { border-style: dashed; }
  .chat .tour pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
  .chat .outils { margin: 6px 0 0; padding-left: 18px; font-family: var(--mono); font-size: 12px; color: var(--doux); }
  #chat-message { font: inherit; width: min(880px, 100%); padding: 6px 8px; border: 1px solid var(--trait);
    border-radius: 6px; background: var(--surface); color: var(--texte); }
  /* L'édition humaine (B1) : le tampon, la barre, la différence. */
  .edition .cm-editor { border: 1px solid var(--trait); background: var(--surface); }
  .edition textarea { width: 100%; min-height: 70vh; font: 13px/1.5 var(--mono); background: var(--surface);
    color: var(--texte); border: 1px solid var(--trait); padding: 8px; tab-size: 4; }
  .barre { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .diff { font: 12px/1.45 var(--mono); white-space: pre-wrap; border: 1px solid var(--trait); padding: 6px; max-height: 50vh; overflow: auto; }
  .diff .plus { background: var(--accent-doux); } .diff .moins { background: var(--marque); }
  ul.liste { list-style: none; padding: 0; margin: 0; }
  ul.liste li { padding: 4px 0; border-bottom: 1px solid var(--trait); display: flex; gap: 12px; flex-wrap: wrap; }
  ul.liste .meta { color: var(--doux); font-size: 13px; }
  .grille { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; }
  @media (max-width: 900px) { .grille { grid-template-columns: 1fr; } }
  .code { background: var(--surface); border: 1px solid var(--trait); border-radius: 8px; overflow-x: auto;
    font: 13px/1.55 var(--mono); }
  .code table { border-collapse: collapse; width: 100%; }
  .code td { padding: 0 10px; vertical-align: top; white-space: pre; }
  .code td.n { color: var(--doux); text-align: right; user-select: none; width: 1%; }
  .code td.n a { color: var(--doux); }
  .code tr:target, .code tr.vise { background: var(--marque); }
  .code a.id { color: inherit; }
  .code a.id:hover { color: var(--accent); text-decoration: underline; }
  aside { font-size: 14px; }
  aside .scope { padding: 3px 0 3px calc(var(--profondeur, 0) * 14px); border-bottom: 1px solid var(--trait); }
  .pastille { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--accent-doux); color: var(--accent); }
  .resultat { padding: 8px 0; border-bottom: 1px solid var(--trait); }
  .resultat pre { margin: 4px 0 0; font: 12px/1.45 var(--mono); white-space: pre-wrap; color: var(--doux); }
  .graphe { background: var(--surface); border: 1px solid var(--trait); border-radius: 8px; overflow: auto; }
  .graphe svg { display: block; }
  .graphe .noeud rect { fill: var(--fond); stroke: var(--trait); }
  .graphe .noeud.centre rect { fill: var(--accent-doux); stroke: var(--accent); }
  .graphe .noeud text { fill: var(--texte); font: 12px system-ui, sans-serif; }
  .graphe .noeud text.lieu { fill: var(--doux); font: 10px var(--mono); }
  .graphe .noeud a:hover text.titre { fill: var(--accent); text-decoration: underline; }
  .graphe path { fill: none; stroke: var(--doux); stroke-opacity: .55; }
  .graphe path.devine { stroke-dasharray: 4 3; }
  /* Les propositions (page 08) : le diff de graphe sur le dessin. */
  .graphe .etape.ajoute rect { fill: var(--accent-doux); stroke: var(--accent); stroke-width: 2; }
  .graphe .etape.change rect { fill: var(--marque); stroke: var(--alerte); }
  .graphe .etape.retire { opacity: .5; }
  .graphe .etape.retire rect { stroke-dasharray: 4 3; }
  .graphe path.ajoutee { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2; }
  .graphe path.retiree { stroke-dasharray: 4 3; stroke-opacity: .35; }
  .proposition .refus { white-space: pre-wrap; font: 12px/1.45 var(--mono); color: var(--alerte); border: 1px solid var(--alerte); padding: 8px; }
  .proposition .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  /* Les réactions ((b)) : les runs récents, un par ligne. */
  table.runs { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.runs th, table.runs td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--trait); }
  table.runs th { color: var(--doux); font-weight: 600; }
  table.runs td.fin.echec { color: var(--alerte); }
  /* Le DAG vivant (C2) : un nœud passé s'allume, un nœud en échec se borde. */
  .graphe .etape rect { fill: var(--fond); stroke: var(--trait); }
  .graphe .etape.passe rect { fill: var(--accent-doux); stroke: var(--accent); }
  .graphe .etape.echec rect { fill: var(--marque); stroke: var(--alerte); }
  .graphe .etape text { fill: var(--texte); font: 12px system-ui, sans-serif; }
  .graphe .etape text.lieu, .graphe .etape text.duree { fill: var(--doux); font: 10px var(--mono); }
  .graphe text.port { fill: var(--doux); font: 10px var(--mono); }
</style>
</head>
<body>
<header>
  <a class="marque-ide" href="/ide/">IDE</a>
  <span id="fil"></span>
  <form id="chercher" hidden><input name="q" type="search" placeholder="chercher dans le code" aria-label="chercher dans le code"></form>
  <span id="lien">flux : en attente</span>
</header>
<main id="vue"><p class="note">Chargement…</p></main>

<!-- Les outils que la page appelle, avec leurs paramètres : un test les
     confronte au gabarit `code` (ide::tests). À tenir à jour avec les appels. -->
<script type="application/json" id="outils">
{
  "list_files": ["path_prefix", "limit", "format"],
  "read_file": ["path", "offset", "limit", "format"],
  "outline": ["path", "format"],
  "edit_file": ["path", "content", "expected_hash"],
  "usages": ["name", "limit", "format"],
  "impact": ["name", "depth", "format"],
  "callees": ["name", "depth", "format"],
  "search_code": ["query", "options"]
}
</script>

<script type="module" src="/ide/page.js"></script>
</body>
</html>
