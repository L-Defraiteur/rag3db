[package]
name = "rag3weaver"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RAG pipeline orchestrator: events, config, embedder and DB traits for rag3db"

[lib]
crate-type = ["lib", "staticlib"]

# Lints scopés au paquet. On n'utilise PAS RUSTFLAGS=-D warnings au CI : cargo
# ne plafonne les lints (`--cap-lints allow`) que pour les dépendances issues
# d'un registre, pas pour les dépendances par chemin. Avec lucivy en local, un
# RUSTFLAGS global ferait échouer le build sur des warnings de lucistore — du
# code qu'on ne maîtrise pas ici.
[lints.rust]
warnings = "deny"

[dependencies]
async-broadcast = "0.7"
blake3 = "1"
text-splitter = { version = "0.28", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
# Le rendu des résultats est un **gabarit**, pas du `format!` en dur : la
# forme d'une fiche de recherche est une question de goût qui change plus vite
# que le moteur, et elle doit pouvoir être remplacée sans recompiler la
# logique. Voir `templates/render/`.
minijinja = { version = "2", default-features = false, features = ["builtins", "loop_controls", "serde"] }
# Tokio est là pour **attendre** — le réacteur (select sur le bus, minuteurs),
# plus tard un serveur et les appels cloud en parallèle. Le calcul (catalogue,
# nœuds, ingestion) reste synchrone, en parallèle par niveau ; les deux cohabitent.
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

# Candle embedder (feature flag, active par defaut)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.4", optional = true }

# lucivy — **publié**, 3.0.8 (29 août 2026). C'était une dépendance par chemin
# tant que la v3 n'était pas sur crates.io : l'usage naïf de rag3weaver la
# validait, et l'arbre a bougé huit fois pendant ce temps. Maintenant qu'elle
# est publiée, on prend la version — un `cargo build` ne dépend plus d'un dépôt
# voisin, et ce qu'on compile est ce que tout le monde compile.
lucivy-core = "3.0.8"
# Moteur : nécessaire pour construire les LucivyDocument à l'indexation.
ld-lucivy = { version = "3.0.8", default-features = false, features = ["stopwords", "lz4-compression"] }


# sparse_vector — crate ami de lucivy (Apache-2.0, dérivé en partie de Qdrant,
# voir son NOTICE), persistance via lucistore. Publié avec le reste en 3.0.8.
sparse-vector = "3.0.8"

# rag3db native (feature flag, pour natif + Node.js)
rag3db = { path = "../../tools/rust_api", optional = true }

# burn (GPU-agnostique : Vulkan/WebGPU/Metal/CUDA — feature flag)
burn = { version = "0.22.0-pre.2", optional = true, default-features = false, features = ["std", "wgpu"] }
burn-store = { version = "0.22.0-pre.2", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }

# Parseurs de code (tree-sitter, 12 langages) : entités File / Scope et
# relations résolues. Crate du dépôt, feature `code`.
codeparsers = { path = "codeparsers", optional = true }
regex = { version = "1", optional = true }

# ─── Fournisseurs LLM distants (feature `openai-llm`) ────────────────────────
# Client HTTP **bloquant**. Pourquoi ureq et pas reqwest/genai/rig : le trait
# `Llm` est synchrone parce que `Node::execute` l'est. Le client cloud est
# `ureq` (bloquant, rustls, 3 lignes de Cargo.lock) : un appel LLM occupe un
# fil le temps de la réponse, lu en SSE par `BufRead::read_line`. Tokio est
# là pour attendre (réacteur, minuteurs), pas pour ces appels — quand on
# voudra N appels cloud sans N fils, ce sera un client async sur tokio, pas
# une « simplification » de celui-ci.
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }
# Déjà dans l'arbre via ureq (rustls→ring) : déclarés pour que `gcp_auth`
# puisse signer un JWT RS256 sans ajouter le moindre crate.
ring = { version = "0.17", optional = true }
base64 = { version = "0.22", optional = true }

# PostgreSQL/Supabase backend (feature flag)
tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
postgres-types = { version = "0.2", optional = true, features = ["derive"] }
bytes = { version = "1", optional = true }
jiff = "0.2.35"

[features]
# Aucun embedder par défaut : la crate est un orchestrateur, `Catalog` prend un
# `Box<dyn Embedder>`, et chaque provider se paie à l'activation. `burn-embedder`
# est le chemin produit (AMD/NVIDIA/Apple/navigateur, un seul code) ; candle
# reste l'oracle de parité, jamais une dépendance produit.
default = []
candle-embedder = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
bge-m3 = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
cuda = ["dep:candle-core", "dep:candle-nn", "candle-core/cuda", "candle-nn/cuda"]
rag3db-native = ["dep:rag3db"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:postgres-types", "dep:bytes"]
# Embedder BGE-M3 via burn — pas de candle, pas de CUDA, pas de hf-hub.
# Le modele generé vit dans generated/bge_m3_onnx.rs ; les poids se chargent
# depuis un .bpk fourni par l'appelant (cf generated/README.md).
burn-embedder = ["dep:burn", "dep:burn-store", "dep:tokenizers", "vulkan"]
# OCR : décodage d'images (PNG/JPEG/WebP…) pour `OcrImage::decode` et le nœud
# `OcrNode`. Le trait `Ocr` et le nœud existent sans la feature ; le modèle
# PP-OCRv6 sur burn est sous `burn-ocr`.
ocr = ["dep:image"]
code = ["dep:codeparsers", "dep:regex"]
# PP-OCRv6 tiny (détection DB + reconnaissance CTC) sur burn — sans tokenizers.
# Les graphes générés vivent dans generated/ppocrv6_tiny_{det,rec}_onnx.rs ; les
# poids (.bpk) et le dictionnaire se chargent depuis un dossier (cf generated/README.md).
burn-ocr = ["ocr", "dep:burn", "dep:burn-store", "vulkan"]
# **HIP/ROCm : le chemin natif d'une carte AMD**, à côté de wgpu et non à sa
# place. `Device` de burn 0.22 dispatche à l'exécution, donc les deux piles
# tiennent dans le même binaire et le choix se fait par `rocm:N` dans
# `RAG3WEAVER_BURN_DEVICE_*`.
#
# Demande ROCm installé (`/opt/rocm`, `libhsa-runtime64`, `hipcc`) — d'où la
# feature séparée : personne ne doit avoir à l'installer pour compiler.
burn-rocm = ["dep:burn", "dep:burn-store", "burn/rocm"]
# **SPIR-V épinglé.** Une feature de *notre* crate, pas seulement de `burn` :
# `burn_device.rs` teste `cfg(feature = "vulkan")` pour appeler
# `Device::vulkan()` au lieu de `Device::wgpu()`. Déclarée seulement sur la
# dépendance, ce `cfg` aurait été faux en silence — et on serait resté sur
# l'`AutoCompiler`, qui choisit son langage de shader à l'exécution d'après les
# features présentes. C'est ce choix invisible qui faisait passer un `drain` de
# 3,1 s à 71 s dès qu'on ajoutait un autre backend (28 août 2026).
vulkan = ["burn/vulkan"]
# LLM distant derrière un endpoint compatible OpenAI : OpenAI, Vertex AI
# (.../endpoints/openapi), Gemini AI Studio (/v1beta/openai), Mistral,
# llama.cpp --server, vLLM, Ollama, OpenRouter. Un seul client les couvre.
# `gcp_auth` (JWT RS256 + OAuth2, pour Vertex) est inclus : zéro crate de plus.
openai-llm = ["dep:ureq", "dep:ring", "dep:base64"]

[dependencies.rayon]
version = "1.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
async-openai = { version = "0.32", features = ["embedding"] }
tempfile = "3"

[[example]]
name = "tei_reqwest"

[[example]]
name = "tei_openai"

[[example]]
name = "candle_local"
required-features = ["candle-embedder"]

# Vecteurs de référence candle, pour valider tout backend alternatif.
[[example]]
name = "bge_m3_reference"
required-features = ["bge-m3"]

# Parité burn vs candle, via les traits publics.
[[example]]
name = "burn_vs_candle"
required-features = ["burn-embedder"]

[[example]]
name = "minilm_reference"
required-features = ["candle-embedder"]

[[example]]
name = "burn_minilm_vs_candle"
required-features = ["burn-embedder"]

# Idem pour paraphrase-multilingual-MiniLM-L12-v2 (dense multilingue, 384 d).
[[example]]
name = "multilingual_minilm_reference"
required-features = ["candle-embedder"]

[[example]]
name = "burn_multilingual_minilm_vs_candle"
required-features = ["burn-embedder"]

# Logits de référence candle pour le cross-encoder, et la parité burn en face.
[[example]]
name = "reranker_reference"
required-features = ["candle-embedder"]

[[example]]
name = "burn_reranker_vs_candle"
required-features = ["burn-embedder"]

# Idem pour les cross-encoders XLM-RoBERTa multilingues (mmarco-mMiniLMv2 et
# bge-reranker-v2-m3, choisis par argv).
[[example]]
name = "xlmr_reranker_reference"
required-features = ["candle-embedder"]

[[example]]
name = "burn_xlmr_reranker_vs_candle"
required-features = ["burn-embedder"]

# Balayage de débit (batch × longueur de séquence).
[[example]]
name = "burn_throughput"
required-features = ["burn-embedder"]

# Parité PP-OCRv6 tiny : burn (wgpu) contre onnxruntime (oracle Python jetable).
[[example]]
name = "burn_ppocr_vs_onnxruntime"
required-features = ["burn-ocr"]


# Premier appel réel à un fournisseur distant (clé lue dans l'environnement).
[[example]]
name = "openai_llm_stream"
required-features = ["openai-llm"]

# ─── Ce que la compilation écrit sur le disque ───────────────────────────────
#
# **La vraie cause du poste qui rame**, trouvée le 28 août 2026 en regardant
# `/proc/pressure/io` au lieu du CPU : pendant l'édition de liens, `full` monte
# à 60 % — soixante pour cent du temps, *aucune* tâche n'avance, tout le monde
# attend le disque. Le CPU est à 11 %, la pression mémoire à zéro.
#
# Pourquoi : CachyOS plafonne `vm.dirty_bytes` à 256 Mo
# (`/usr/lib/sysctl.d/70-cachyos-settings.conf`) — un réglage de latence pour
# un bureau, qui suppose de petites écritures. Une passe en écrivait 48 Go :
# 34 binaires de test à 1,4 Go, presque entièrement du DWARF que le linker
# recopie depuis les `.o`. Au-delà du plafond, chaque `write()` bloque
# jusqu'au vidage — et tout le monde attend dans la même file, Chrome et
# l'éditeur compris.
#
# `unpacked` laisse le DWARF dans les `.o` : le linker n'a plus rien à recopier.
# `line-tables-only` garde ce dont on se sert vraiment — `RUST_BACKTRACE=1` et
# ses `fichier:ligne` — et jette ce qu'on ne lit jamais depuis un test.
[profile.test]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev]
split-debuginfo = "unpacked"
