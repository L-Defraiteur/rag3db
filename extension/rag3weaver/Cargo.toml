cubecl-common = { git = "https://github.com/L-Defraiteur/cubecl", rev = "0565518f" }
cubecl-core = { git = "https://github.com/L-Defraiteur/cubecl", rev = "0565518f" }
cubecl-cpp = { git = "https://github.com/L-Defraiteur/cubecl", rev = "0565518f" }
