cubek-convolution = { git = "https://github.com/L-Defraiteur/cubek", rev = "3062b6a1" }
cubek-fft = { git = "https://github.com/L-Defraiteur/cubek", rev = "3062b6a1" }
cubek-interpolate = { git = "https://github.com/L-Defraiteur/cubek", rev = "3062b6a1" }
