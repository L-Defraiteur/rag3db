[package]
name = "rag3weaver"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
description = "RAG pipeline orchestrator: events, config, embedder and DB traits for rag3db"

[lib]
crate-type = ["lib", "staticlib"]

# Lints scopés au paquet. On n'utilise PAS RUSTFLAGS=-D warnings au CI : cargo
# ne plafonne les lints (`--cap-lints allow`) que pour les dépendances issues
# d'un registre, pas pour les dépendances par chemin. Avec lucivy en local, un
# RUSTFLAGS global ferait échouer le build sur des warnings de lucistore — du
# code qu'on ne maîtrise pas ici.
[lints.rust]
warnings = "deny"

[dependencies]
async-broadcast = "0.7"
blake3 = "1"
text-splitter = { version = "0.28", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
# Le rendu des résultats est un **gabarit**, pas du `format!` en dur : la
# forme d'une fiche de recherche est une question de goût qui change plus vite
# que le moteur, et elle doit pouvoir être remplacée sans recompiler la
# logique. Voir `templates/render/`.
minijinja = { version = "2", default-features = false, features = ["builtins", "loop_controls", "serde"] }
# Tokio est là pour **attendre** — le réacteur (select sur le bus, minuteurs),
# plus tard un serveur et les appels cloud en parallèle. Le calcul (catalogue,
# nœuds, ingestion) reste synchrone, en parallèle par niveau ; les deux cohabitent.
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

# Candle embedder (feature flag, active par defaut)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.4", optional = true }

# lucivy — **publié**, 4.0.1 (6 septembre 2026). C'était une dépendance par
# chemin tant que la v3 n'était pas sur crates.io : l'usage naïf de rag3weaver
# la validait, et l'arbre a bougé huit fois pendant ce temps. Maintenant qu'elle
# est publiée, on prend la version — un `cargo build` ne dépend plus d'un dépôt
# voisin, et ce qu'on compile est ce que tout le monde compile.
#
# La 4.0 apporte le **dictionnaire partagé** (une occurrence de chaque texte de
# jeton par shard au lieu d'une par segment) : ~20 % de disque et de RAM en
# moins, mêmes comptes, mêmes spans, mêmes scores. On le prend explicitement en
# posant `sfx_version: 4` (voir `fts_handle::build_schema_config`).
#
# **Porte à sens unique.** La 4.0 ouvre les index 3.0.x, mais le premier commit
# d'une 4.0 convertit l'index pour de bon : une 3.0.x ne le rouvrira plus. Un
# index existant garde en revanche la version que dit son `meta.json` — il ne
# gagne le dictionnaire qu'en étant rebâti.
lucivy-core = "4.0.1"
# Moteur : nécessaire pour construire les LucivyDocument à l'indexation.
ld-lucivy = { version = "4.0.1", default-features = false, features = ["stopwords", "lz4-compression"] }


# sparse_vector — crate ami de lucivy (Apache-2.0, dérivé en partie de Qdrant,
# voir son NOTICE), persistance via lucistore. Publié avec le reste en 4.0.1.
sparse-vector = "4.0.1"

# rag3db native (feature flag, pour natif + Node.js)
rag3db = { path = "../../tools/rust_api", optional = true }

# **Un collecteur de `log`, partout.** cubecl dit beaucoup (tailles CMMA vues,
# chaque autotune et son gagnant, chaque compilation de noyau) en `log::debug!`
# — sans collecteur, ces lignes n'existent nulle part, et on a mesuré à
# l'aveugle deux semaines. `RUST_LOG=cubecl_wgpu=debug,cubecl_runtime=info`.
log = "0.4"
env_logger = "0.11"
# burn (GPU-agnostique : Vulkan/WebGPU/Metal/CUDA — feature flag)
burn = { version = "0.22.0-pre.3", optional = true, default-features = false, features = ["std", "wgpu"] }
burn-store = { version = "0.22.0-pre.3", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }

# Parseurs de code (tree-sitter, 12 langages) : entités File / Scope et
# relations résolues. Crate du dépôt, feature `code`.
codeparsers = { path = "codeparsers", optional = true }
regex = { version = "1", optional = true }

# ─── Fournisseurs LLM distants (feature `openai-llm`) ────────────────────────
# Client HTTP **bloquant**. Pourquoi ureq et pas reqwest/genai/rig : le trait
# `Llm` est synchrone parce que `Node::execute` l'est. Le client cloud est
# `ureq` (bloquant, rustls, 3 lignes de Cargo.lock) : un appel LLM occupe un
# fil le temps de la réponse, lu en SSE par `BufRead::read_line`. Tokio est
# là pour attendre (réacteur, minuteurs), pas pour ces appels — quand on
# voudra N appels cloud sans N fils, ce sera un client async sur tokio, pas
# une « simplification » de celui-ci.
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }
# Serveur HTTP **bloquant**, pour le démon d'embedding.
#
# La première justification écrite ici — « symétrique d'`ureq`, parce que le
# moteur est synchrone par choix » — était fausse : le synchrone n'est plus un
# principe depuis l'abandon de wasm, seulement un état de fait (issue 03 du
# 29 août). Voici celle qui tient : **le travail de ce serveur est du calcul
# GPU pour peu de clients**. L'async sert ce qui *attend* ; ici tout calcule,
# et les embarquements se sérialisent de toute façon sur une carte unique. Un
# runtime n'achèterait rien. Les quelques fils de `tiny_http` servent à ce que
# la sonde `/sante` réponde pendant qu'un lot occupe la carte.
tiny_http = { version = "0.12", optional = true }
# Déjà dans l'arbre via ureq (rustls→ring) : déclarés pour que `gcp_auth`
# puisse signer un JWT RS256 sans ajouter le moindre crate.
ring = { version = "0.17", optional = true }
base64 = { version = "0.22", optional = true }

# PostgreSQL/Supabase backend (feature flag)
tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
postgres-types = { version = "0.2", optional = true, features = ["derive"] }
bytes = { version = "1", optional = true }
jiff = "0.2.35"

[features]
# Aucun embedder par défaut : la crate est un orchestrateur, `Catalog` prend un
# `Box<dyn Embedder>`, et chaque provider se paie à l'activation. `burn-embedder`
# est le chemin produit (AMD/NVIDIA/Apple/navigateur, un seul code) ; candle
# reste l'oracle de parité, jamais une dépendance produit.
default = []
candle-embedder = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
bge-m3 = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
cuda = ["dep:candle-core", "dep:candle-nn", "candle-core/cuda", "candle-nn/cuda"]
rag3db-native = ["dep:rag3db"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:postgres-types", "dep:bytes"]
# Embedder BGE-M3 via burn — pas de candle, pas de CUDA, pas de hf-hub.
# Le modele generé vit dans generated/bge_m3_onnx.rs ; les poids se chargent
# depuis un .bpk fourni par l'appelant (cf generated/README.md).
burn-embedder = ["dep:burn", "dep:burn-store", "dep:tokenizers", "vulkan", "burn-autotune", "burn-fusion"]
# **Autotune et fusion, nommées chez nous.** Deux features de burn qu'on croyait
# avoir et qu'on n'avait pas : `burn` est pris sans ses defaults, et seule
# `burn-rocm` les rallumait — d'où le « facteur 14 » du 28 août (une chauffe
# d'autotune en -O0). Nommées ici pour que `cfg!(feature = …)` les voie et
# que `burn_device.rs` puisse dire ce qui tourne. Mesuré le 6 septembre 2026
# sur BGE-M3, Vulkan : l'autotune seul rend la flash attention (sans lui, la
# stratégie par défaut est le repli naïf) et les noyaux CMMA ; la fusion
# reprend les LayerNorm déroulées. Ensemble, avec Flex32 : 5 300 → 15 000
# jetons/s sur 8×100 mots. Voir docs/issues/6-septembre-2026/03.
#
# **La fusion est dans le défaut depuis pre.3.** En 0.22.0-pre.2 elle cassait
# les deux rerankers (la matmul fusionnée de la tête `n = 1` n'avait aucun
# candidat viable, cubecl paniquait) et faussait l'OCR ; sur pre.3 les six
# suites de modèles passent avec (6 septembre 2026, soir). Une feature par
# binaire, pas par modèle : si un modèle la refuse un jour, c'est tout le
# binaire qui s'en passe.
burn-autotune = ["burn/autotune"]
burn-fusion = ["burn/fusion"]
# OCR : décodage d'images (PNG/JPEG/WebP…) pour `OcrImage::decode` et le nœud
# `OcrNode`. Le trait `Ocr` et le nœud existent sans la feature ; le modèle
# PP-OCRv6 sur burn est sous `burn-ocr`.
ocr = ["dep:image"]
code = ["dep:codeparsers", "dep:regex"]
# PP-OCRv6 tiny (détection DB + reconnaissance CTC) sur burn — sans tokenizers.
# Les graphes générés vivent dans generated/ppocrv6_tiny_{det,rec}_onnx.rs ; les
# poids (.bpk) et le dictionnaire se chargent depuis un dossier (cf generated/README.md).
burn-ocr = ["ocr", "dep:burn", "dep:burn-store", "vulkan"]
# **HIP/ROCm : le chemin natif d'une carte AMD**, à côté de wgpu et non à sa
# place. `Device` de burn 0.22 dispatche à l'exécution, donc les deux piles
# tiennent dans le même binaire et le choix se fait par `rocm:N` dans
# `RAG3WEAVER_BURN_DEVICE_*`.
#
# Demande ROCm installé (`/opt/rocm`, `libhsa-runtime64`, `hipcc`) — d'où la
# feature séparée : personne ne doit avoir à l'installer pour compiler.
burn-rocm = ["dep:burn", "dep:burn-store", "burn/rocm"]
# **SPIR-V épinglé.** Une feature de *notre* crate, pas seulement de `burn` :
# `burn_device.rs` teste `cfg(feature = "vulkan")` pour appeler
# `Device::vulkan()` au lieu de `Device::wgpu()`. Déclarée seulement sur la
# dépendance, ce `cfg` aurait été faux en silence — et on serait resté sur
# l'`AutoCompiler`, qui choisit son langage de shader à l'exécution d'après les
# features présentes. C'est ce choix invisible qui faisait passer un `drain` de
# 3,1 s à 71 s dès qu'on ajoutait un autre backend (28 août 2026).
vulkan = ["burn/vulkan"]
# **Le démon** : un modèle chargé une fois, servi à plusieurs.
#
# Mesuré le 29 août 2026 : une passe E2E rechargeait BGE-M3 sept fois, et sept
# chargements concurrents prenaient 531, 465, 341, 280… secondes là où un seul
# en prend cinq. Ce n'est pas le chargement qui est lent, c'est la concurrence.
#
# Au-delà des tests, c'est la première brique de ce qu'un terminal interrogera,
# et de « savoir démarrer un serveur » — ce dont la boucle étrange aura besoin
# pour qu'un agent monte un backend (doc 08).
daemon = ["dep:tiny_http", "dep:ureq", "dep:base64"]
# LLM distant derrière un endpoint compatible OpenAI : OpenAI, Vertex AI
# (.../endpoints/openapi), Gemini AI Studio (/v1beta/openai), Mistral,
# llama.cpp --server, vLLM, Ollama, OpenRouter. Un seul client les couvre.
# `gcp_auth` (JWT RS256 + OAuth2, pour Vertex) est inclus : zéro crate de plus.
openai-llm = ["dep:ureq", "dep:ring", "dep:base64"]

[dependencies.rayon]
version = "1.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
async-openai = { version = "0.32", features = ["embedding"] }
tempfile = "3"

# **Le démon d'embedding.** Un modèle chargé une fois, servi à plusieurs — voir
# `src/daemon.rs`. `required-features` plutôt qu'un `cfg` dans le fichier : un
# binaire qui ne compile pas faute de feature doit être *absent*, pas cassé.
[[bin]]
name = "rag3weaver-embeddings"
path = "src/bin/rag3weaver-embeddings.rs"
required-features = ["daemon", "burn-embedder"]

# **rag3daemon.** Le processus qui tient la base et la sert — voir
# `src/daemon/db.rs`. Une base rag3db ne s'ouvre que par un processus à la fois ;
# celui-ci est ce processus, mis derrière une adresse.
[[bin]]
name = "rag3daemon"
path = "src/bin/rag3daemon.rs"
required-features = ["daemon", "rag3db-native"]

[[example]]
name = "tei_reqwest"

[[example]]
name = "tei_openai"

[[example]]
name = "candle_local"
required-features = ["candle-embedder"]

# Vecteurs de référence candle, pour valider tout backend alternatif.
[[example]]
name = "bge_m3_reference"
required-features = ["bge-m3"]

# Parité burn vs candle, via les traits publics.
[[example]]
name = "burn_vs_candle"
required-features = ["burn-embedder"]

[[example]]
name = "minilm_reference"
required-features = ["candle-embedder"]

[[example]]
name = "burn_minilm_vs_candle"
required-features = ["burn-embedder"]

# Idem pour paraphrase-multilingual-MiniLM-L12-v2 (dense multilingue, 384 d).
[[example]]
name = "multilingual_minilm_reference"
required-features = ["candle-embedder"]

[[example]]
name = "burn_multilingual_minilm_vs_candle"
required-features = ["burn-embedder"]

# Logits de référence candle pour le cross-encoder, et la parité burn en face.
[[example]]
name = "reranker_reference"
required-features = ["candle-embedder"]

[[example]]
name = "burn_reranker_vs_candle"
required-features = ["burn-embedder"]

# Idem pour les cross-encoders XLM-RoBERTa multilingues (mmarco-mMiniLMv2 et
# bge-reranker-v2-m3, choisis par argv).
[[example]]
name = "xlmr_reranker_reference"
required-features = ["candle-embedder"]

[[example]]
name = "burn_xlmr_reranker_vs_candle"
required-features = ["burn-embedder"]

# Balayage de débit (batch × longueur de séquence).
[[example]]
name = "burn_throughput"
required-features = ["burn-embedder"]

# Parité PP-OCRv6 tiny : burn (wgpu) contre onnxruntime (oracle Python jetable).
[[example]]
name = "burn_ppocr_vs_onnxruntime"
required-features = ["burn-ocr"]


# Premier appel réel à un fournisseur distant (clé lue dans l'environnement).
[[example]]
name = "openai_llm_stream"
required-features = ["openai-llm"]

# ─── Ce que la compilation écrit sur le disque ───────────────────────────────
#
# **La vraie cause du poste qui rame**, trouvée le 28 août 2026 en regardant
# `/proc/pressure/io` au lieu du CPU : pendant l'édition de liens, `full` monte
# à 60 % — soixante pour cent du temps, *aucune* tâche n'avance, tout le monde
# attend le disque. Le CPU est à 11 %, la pression mémoire à zéro.
#
# Pourquoi : CachyOS plafonne `vm.dirty_bytes` à 256 Mo
# (`/usr/lib/sysctl.d/70-cachyos-settings.conf`) — un réglage de latence pour
# un bureau, qui suppose de petites écritures. Une passe en écrivait 48 Go :
# 34 binaires de test à 1,4 Go, presque entièrement du DWARF que le linker
# recopie depuis les `.o`. Au-delà du plafond, chaque `write()` bloque
# jusqu'au vidage — et tout le monde attend dans la même file, Chrome et
# l'éditeur compris.
#
# `unpacked` laisse le DWARF dans les `.o` : le linker n'a plus rien à recopier.
# `line-tables-only` garde ce dont on se sert vraiment — `RUST_BACKTRACE=1` et
# ses `fichier:ligne` — et jette ce qu'on ne lit jamais depuis un test.
[profile.test]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev]
split-debuginfo = "unpacked"

# **Les dépendances optimisées, même en debug.** Trouvé le 6 septembre 2026 :
# `run_e2e.sh` lance `cargo test` sans `--release`, donc burn, cubecl et
# tokenizers tournaient en -O0 dans tous les bancs — la compilation SPIR-V,
# l'autotune, les lancements de noyaux, la tokenisation. Le GPU ne le voyait
# pas, la chauffe et les petits lots, si. Notre crate reste en debug (compile
# incrémentale rapide), les dépendances non.
[profile.dev.package."*"]
opt-level = 3

# **Trois forks, une ligne chacun** (6 septembre 2026) : sans elles, Flex32 —
# stockage f32, matmul f16 sur les tensor cores, accumulation f32 — n'était
# utilisable nulle part, et le disait par des vecteurs identiques au bit près à
# f32. Chaque branche `rag3weaver/pre.3` part du tag exact du lock
# (`v0.11.0-pre.3`, `v0.22.0-pre.3`, `v0.3.0-pre.3`) et porte un commit,
# épinglé ici par sa révision (un poste sans réseau compile dès que
# `~/.cargo/git` a le clone ; sinon c'est le même besoin que crates.io) ; les
# branches `rag3weaver/pre.2` portent le même sur la version d'avant, d'où on
# vient (montée le 6 septembre 2026 : Flex32 y fait ×2, les formes inédites
# ×4, et le f16 ROCm sur RDNA4 y compile). Liste dans docs/forks-burn-cubecl-cubek.md, récit dans
# docs/issues/6-septembre-2026/03, PR amont à ouvrir ; ce
# bloc disparaît le jour où elles sont fusionnées.
#
# **Chaque atelier en entier**, pas trois crates : patcher un seul crate d'un
# dépôt tire ses voisins du même dépôt en double de ceux du registre, et deux
# `cubecl_common::Device` ne sont pas le même trait. Les trois forks sont au
# tag exact du lock ; tout le reste est identique à crates.io.
[patch.crates-io]
burn = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-autodiff = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-backend = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-backend-extension = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-core = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-cpu = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-cuda = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-derive = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-dispatch = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-flex = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-fusion = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-ir = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-ndarray = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-nn = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-optim = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-pack = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-remote = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-rocm = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-router = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-std = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-store = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-tch = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-tensor = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-vision = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
burn-wgpu = { git = "https://github.com/L-Defraiteur/burn", rev = "669686ec" }
