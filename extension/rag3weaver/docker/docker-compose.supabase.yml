version: "3.8"

services:
  supabase-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag3weaver
      POSTGRES_PASSWORD: rag3weaver
      POSTGRES_DB: rag3weaver_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag3weaver -d rag3weaver_test"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
